# =============================================================================
# Monorepo — stack de produção (usada pelo CI no pi01)
#
#   web      → frontend Vite/React (nginx)  → jiujitsuunicamp.com.br
#   strapi   → CMS headless (Strapi)        → files.jiujitsuunicamp.com.br
#   postgres → banco de dados do Strapi
#
# Os workflows do GitHub Actions alvejam serviços específicos (web, ou
# strapi+postgres) para redeployar apenas o app que mudou.
# Para dev local de um app isolado, use o docker-compose.yml dentro de apps/*.
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Frontend — Vite/React servido por nginx
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      target: prod
    container_name: jiujitsu-unicamp-web
    restart: unless-stopped
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jiujitsu.rule=Host(`jiujitsuunicamp.com.br`)"
      - "traefik.http.routers.jiujitsu.entrypoints=web"
      - "traefik.http.services.jiujitsu.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # Strapi — CMS headless
  # ---------------------------------------------------------------------------
  strapi:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: bjju-strapi
    restart: unless-stopped
    env_file: ./apps/cms/.env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
    volumes:
      # Persiste os uploads de mídia entre deploys
      - strapi-uploads:/app/public/uploads
    networks:
      - default    # comunicação interna com o postgres
      - proxy_net  # visível pelo Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.bjju-strapi.rule=Host(`files.jiujitsuunicamp.com.br`)"
      - "traefik.http.routers.bjju-strapi.entrypoints=web"
      - "traefik.http.services.bjju-strapi.loadbalancer.server.port=1337"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL — banco de dados relacional
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bjju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Persiste os dados do banco entre reinicializações
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

# -----------------------------------------------------------------------------
# Volumes — reaproveitam os dados já existentes no pi01, criados pelo antigo
# projeto compose "bjju-backend". external: true garante o reuso dos dados e
# protege contra remoção acidental por `docker compose down -v`.
# Em um servidor novo, crie-os antes do primeiro deploy:
#   docker volume create bjju-backend_postgres-data
#   docker volume create bjju-backend_strapi-uploads
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    external: true
    name: bjju-backend_postgres-data
  strapi-uploads:
    external: true
    name: bjju-backend_strapi-uploads

networks:
  default: {}
  proxy_net:
    external: true
